name: RAPP/1 compliance

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Check out pinned protocol and ancestor
        run: |
          git clone https://github.com/kody-w/rapp-1.git "$RUNNER_TEMP/rapp-1"
          git -C "$RUNNER_TEMP/rapp-1" checkout caf6ef276cafa92aa744499af90dc1a28559941a
          git clone https://github.com/kody-w/RAPP.git "$RUNNER_TEMP/RAPP"
          git -C "$RUNNER_TEMP/RAPP" checkout f97ed45fba0cf087b73b938ab2a6c529afe2ac57

      - name: Install existing dependencies
        run: |
          python -m pip install -r installer/requirements.txt
          python -m pip install -r "$RUNNER_TEMP/RAPP/rapp_brainstem/requirements.txt"
          npm ci

      - name: Run integrated suite
        env:
          RAPP_OWNER: kody-w
          RAPP_BRAINSTEM_PATH: ${{ runner.temp }}/RAPP/rapp_brainstem
          RAPP1_REFERENCE_PATH: ${{ runner.temp }}/rapp-1/rapp.py
        run: bash tests/run.sh

      - name: Run official artifact checker
        run: python "$RUNNER_TEMP/rapp-1/rapp_check.py" .

      - name: Run Frontier desktop suite
        run: npm test

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm --prefix mobile ci

      - name: Run mobile release gate
        run: npm --prefix mobile run release:gate

      - name: Run mobile lint, types, and tests
        run: |
          npm --prefix mobile run lint -- --max-warnings 0
          npm --prefix mobile run typecheck
          npm --prefix mobile test

      - name: Export static web application
        run: npm --prefix mobile run export:web

      - name: Resolve Expo native configuration
        working-directory: mobile
        run: |
          npx expo config --type prebuild --json > /tmp/holo-zoo-expo-config.json
          npx expo prebuild --platform android --no-install
          grep -q 'android:usesCleartextTraffic=\"true\"' android/app/src/main/AndroidManifest.xml
          for permission in READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE SYSTEM_ALERT_WINDOW VIBRATE; do
            grep -q "android.permission.${permission}\" tools:node=\"remove\"" android/app/src/main/AndroidManifest.xml
          done

  package:
    needs:
      - test
      - mobile
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm run dist:dir

      - uses: actions/upload-artifact@v4
        with:
          name: rapp-zoo-${{ runner.os }}
          path: release/
          if-no-files-found: error
